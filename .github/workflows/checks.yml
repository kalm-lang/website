name: Website checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KALM_PACKAGES_READ_TOKEN: ${{ secrets.KALM_PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment safeguards
        run: python3 -m unittest discover -s scripts -p 'test_deploy_website.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: npm install --no-package-lock --no-audit --no-fund --fetch-retries=0
      - run: npm run check
      - run: npm run build
