name: Release website

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KALM_PACKAGES_USER: ${{ vars.KALM_PACKAGES_USER || github.actor }}
      KALM_PACKAGES_READ_TOKEN: ${{ secrets.KALM_PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate website release tag
        env:
          WEBSITE_TAG: ${{ github.ref_name }}
        run: python3 scripts/deploy_website.py validate-tag "$WEBSITE_TAG"
      - name: Check deployment safeguards
        run: python3 -m unittest discover -s scripts -p 'test_deploy_website.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install website dependencies
        run: npm install --no-package-lock --no-audit --no-fund --fetch-retries=0
      - run: npm run check
      - run: npm run test:content
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm run verify:code
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --max-failures=1
      - uses: actions/upload-artifact@v4
        with:
          name: kalm-website
          path: dist
          if-no-files-found: error

  deploy:
    needs: website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    concurrency:
      group: prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: kalm-website
          path: dist
      - name: Deploy website to FTP root
        env:
          DESTINATION_FTP_HOST: ${{ secrets.DESTINATION_FTP_HOST }}
          DESTINATION_FTP_PASSWORD: ${{ secrets.DESTINATION_FTP_PASSWORD }}
          DESTINATION_FTP_PORT: ${{ secrets.DESTINATION_FTP_PORT }}
          DESTINATION_FTP_USER: ${{ secrets.DESTINATION_FTP_USER }}
        run: python3 scripts/deploy_website.py deploy dist
